services:
  # Base service for the API
  - type: web
    name: z-era-api
    runtime: node   # Changed 'env' to 'runtime' (recommended)
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: DB_DIALECT
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # Static site for the React frontend
  - type: web       # Must be 'web'
    name: z-era-client
    runtime: static # This defines it as a static site
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: client/dist # Correct field name for blueprints
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: z-era-api
          property: host
